# tvctl-agent configuration: ~/.config/tvctl-agent/config.toml
# Every key is optional; the values below are the defaults. Needs OPENAI_API_KEY (environment or login shell).

[realtime]
# The OpenAI Realtime speech-to-speech model that hears you, talks and calls tvctl.
model = "gpt-realtime-2.1"
# alloy, ash, ballad, coral, echo, sage, shimmer, verse, marin, cedar
voice = "marin"
# When you have finished speaking (semantic VAD): low lets you pause, high answers sooner; auto = medium.
eagerness = "auto"
# near_field (headset, lavalier mic), far_field (laptop or room mic), or off.
noise_reduction = "near_field"
# Transcribes what you say, for the log and memory.
transcribe_model = "gpt-4o-mini-transcribe"
language = "ja"

[speech]
# Lower the player to this volume (percent) while the agent speaks, with `tvctl duck`. Remove to leave duck alone.
duck_level = 10

[model]
# OpenAI model for the web_search tool.
web_search = "gpt-5.4-mini"

[memory]
# Each new session (they last at most 60 minutes) starts with this much of the recent conversation.
recent_chars = 6000

[paths]
# memory = "~/Library/Application Support/tvctl-agent/conversation.jsonl"
# tvctl = "tvctl"
# voice = "<repo>/voice/.build/release/tvctl-voice"

